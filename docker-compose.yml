services:
  music-school:
    build: .
    image: music-school:latest
    container_name: music-school
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - music-school-db:/app/dbstore
      - music-school-media:/app/media
    environment:
      - DJANGO_DB_PATH=/app/dbstore/db.sqlite3
    expose:
      - "8000"
    networks:
      - web

volumes:
  music-school-db:
  music-school-media:

networks:
  web:
    external: true
    name: web
