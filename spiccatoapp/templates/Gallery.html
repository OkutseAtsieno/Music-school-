{% extends "base.html" %}
{% load static %}

{% block title %}Student Gallery | Spiccato Tunes{% endblock %}

{% block content %}
<style>
  .gallery-wrap { padding: .6rem; }
  .gallery-carousel .carousel-inner { border-radius: calc(var(--radius) - 6px); overflow: hidden; background: var(--ink); }
  .gallery-carousel .carousel-item img {
    width: 100%; height: clamp(280px, 68vh, 640px); object-fit: cover; object-position: center;
  }
  .gallery-carousel .carousel-control-prev, .gallery-carousel .carousel-control-next { width: 14%; }
  .gallery-carousel .carousel-control-prev-icon, .gallery-carousel .carousel-control-next-icon {
    width: 3rem; height: 3rem; border-radius: 50%; background-color: rgba(15,27,61,.55); background-size: 45%;
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  .gallery-count {
    position: absolute; right: 1rem; bottom: 1rem; z-index: 3; padding: .25rem .8rem; border-radius: 999px;
    background: rgba(15,27,61,.6); color: #fff; font-size: .8rem; font-weight: 500;
  }
</style>

<section class="section">
  <div class="text-center mb-4">
    <span class="eyebrow">Moments</span>
    <h2 class="section-title mb-0">Student Gallery</h2>
  </div>

  <div class="card-soft gallery-wrap">
    <div id="carouselExampleAutoplaying" class="carousel slide carousel-fade gallery-carousel" data-bs-ride="carousel" data-bs-interval="3000">
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="{% static 'sp.jpg' %}" class="d-block w-100" alt="Student gallery photo 1">
        </div>
        <div class="carousel-item">
          <img src="{% static 'sp1.jpg' %}" class="d-block w-100" alt="Student gallery photo 2">
        </div>
        <div class="carousel-item">
          <img src="{% static 'sp2.jpg' %}" class="d-block w-100" alt="Student gallery photo 3">
        </div>
        <div class="carousel-item">
          <img src="{% static 'sp3.jpg' %}" class="d-block w-100" alt="Student gallery photo 4">
        </div>
        <div class="carousel-item">
          <img src="{% static 'sp4.jpg' %}" class="d-block w-100" alt="Student gallery photo 5">
        </div>
        <div class="carousel-item">
          <img src="{% static 'sp5.jpg' %}" class="d-block w-100" alt="Student gallery photo 6">
        </div>
        <div class="carousel-item">
          <img src="{% static 'sp6.jpg' %}" class="d-block w-100" alt="Student gallery photo 7">
        </div>
        <div class="carousel-item">
          <img src="{% static 'sp7.jpg' %}" class="d-block w-100" alt="Student gallery photo 8">
        </div>
        <div class="carousel-item">
          <img src="{% static 'sp8.jpg' %}" class="d-block w-100" alt="Student gallery photo 9">
        </div>
        <div class="carousel-item">
          <img src="{% static 'sp10.jpg' %}" class="d-block w-100" alt="Student gallery photo 10">
        </div>
        <div class="carousel-item">
          <img src="{% static 'p9.jpg' %}" class="d-block w-100" alt="Student gallery photo 11">
        </div>
        <div class="carousel-item">
          <img src="{% static 'p11.jpg' %}" class="d-block w-100" alt="Student gallery photo 12">
        </div>
      </div>

      <span class="gallery-count" id="gallery-count">1 / 12</span>

      <!-- Controls -->
      <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
      </button>
    </div>
  </div>
</section>

<!-- "3 / 12" counter -->
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const el = document.getElementById("carouselExampleAutoplaying");
    const label = document.getElementById("gallery-count");
    el.addEventListener("slid.bs.carousel", function (e) {
      label.textContent = (e.to + 1) + " / " + el.querySelectorAll(".carousel-item").length;
    });
  });
</script>
{% endblock %}
